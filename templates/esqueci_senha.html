{% extends "base.html" %}
{% block titulo %}Esqueci minha senha — Luqui Brinquedos{% endblock %}
{% block conteudo %}
<div style="max-width:420px;margin:50px auto;padding:0 16px">
  <div style="background:#fff;padding:32px;border-radius:18px">
    <h2 style="color:var(--azul);margin-bottom:8px">Esqueceu a senha?</h2>
    <p style="color:var(--mut);font-size:13px;margin-bottom:20px">Tranquilo, manda o e-mail do seu cadastro que enviamos uma nova senha temporária.</p>
    {% if msg %}<div style="background:#D1FAE5;color:#065F46;padding:10px;border-radius:8px;margin-bottom:14px;font-size:13px">{{ msg }}</div>{% endif %}
    <form method="post">
      <input name="email" type="email" placeholder="Seu e-mail" required
             style="width:100%;padding:12px;border:1px solid var(--linha);border-radius:8px;margin-bottom:14px">
      <button type="submit" class="btn btn-amarelo btn-block" style="padding:14px">Enviar nova senha</button>
    </form>
    <p style="text-align:center;color:var(--mut);font-size:13px;margin-top:18px">
      Lembrou? <a href="/login" style="color:var(--azul);font-weight:700">Voltar pro login</a>
    </p>
  </div>
</div>
{% endblock %}
